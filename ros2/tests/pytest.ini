[pytest]
# ros/slow tests need a built+sourced workspace or minutes of runtime;
# opt in explicitly with `pytest -m ros` / `pytest -m slow`.
addopts = -m "not ros and not slow"
markers =
    node: contract tests against the physics_amm modules (no ROS needed)
    ros: integration tests that need a built workspace and a running node
    slow: long-running tests (reference CLI run)
